name: Publish submission

# A maintainer closes a scored submission as completed: re-download, hash-check,
# store under submissions/issue-<n>/, rebuild the board, commit, reply.
# Closing as not planned rejects with no bot action.
on:
  issues:
    types: [closed]

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  publish:
    if: >
      github.event.issue.state_reason == 'completed' &&
      contains(github.event.issue.labels.*.name, 'submission')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check the closer has write access
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
        run: |
          perm=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$SENDER/permission" --jq .permission)
          case "$perm" in
            admin|maintain|write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "closed by $SENDER ($perm)"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "Closed by the submitter; nothing was published." > "$RUNNER_TEMP/comment.md"
              ;;
          esac

      - name: Reply to submitter close
        if: steps.perm.outputs.allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - uses: actions/checkout@v5
        if: steps.perm.outputs.allowed == 'true'
      - uses: actions/setup-python@v6
        if: steps.perm.outputs.allowed == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scorer/requirements.txt
      - if: steps.perm.outputs.allowed == 'true'
        run: pip install -r scorer/requirements.txt

      - name: Fetch bot comments
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            | jq '[.[][] | select(.user.login == "github-actions[bot]") | {id, body, updated_at}]' \
            > "$RUNNER_TEMP/bot_comments.json"

      - name: Publish
        id: apply
        if: steps.perm.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          BOT_COMMENTS_FILE: ${{ runner.temp }}/bot_comments.json
          SENDER: ${{ github.event.sender.login }}
        run: |
          bash .github/scripts/apply-and-push.sh \
            "Publish submission #$ISSUE_NUMBER (closed by $SENDER)" \
            -- python -m tools.submission publish --comment "$RUNNER_TEMP/comment.md"

      - name: Reply
        if: ${{ always() && steps.perm.outputs.allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.apply.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$RESULT" in
            committed|unchanged|refused)
              [ -f "$RUNNER_TEMP/comment.md" ] || exit 0
              ;;
            push_failed)
              echo "Nothing was published: the push failed 5 times. Close the issue again to retry." \
                > "$RUNNER_TEMP/comment.md"
              ;;
            *)
              echo "Publishing failed; see $RUN_URL." > "$RUNNER_TEMP/comment.md"
              ;;
          esac
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Reopen unless published
        if: ${{ always() && steps.perm.outputs.allowed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          case "$RESULT" in
            committed|unchanged) echo "keeping closed ($RESULT)" ;;
            *) gh issue reopen "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" ;;
          esac

      - name: Summary
        if: always()
        env:
          SENDER: ${{ github.event.sender.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESULT: ${{ steps.apply.outputs.result }}
          ALLOWED: ${{ steps.perm.outputs.allowed }}
        run: |
          {
            echo "### Publish"
            echo "- closer: \`$SENDER\`"
            echo "- allowed: \`$ALLOWED\`"
            echo "- result: \`${RESULT:-n/a}\`"
            echo "- entry: \`issue-$ISSUE_NUMBER\`"
          } >> "$GITHUB_STEP_SUMMARY"
