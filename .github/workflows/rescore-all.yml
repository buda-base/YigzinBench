name: Re-score all submissions

# Run by hand after updating scorer/data (new dataset revision) or the scorer.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scorer/requirements.txt
      - run: pip install -r scorer/requirements.txt
      - run: python -m tools.build_leaderboard --rescore
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add submissions leaderboard README.md
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Re-score all submissions"
          git push
