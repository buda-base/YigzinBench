name: Re-score all submissions

# Run by hand after updating scorer/data (new dataset revision) or the scorer.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: rescore
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scorer/requirements.txt
      - run: pip install -r scorer/requirements.txt
      - name: Re-score and push
        id: apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/apply-and-push.sh \
            "Re-score all submissions" \
            -- python -m tools.build_leaderboard --rescore
      - name: Summary
        if: always()
        env:
          RESULT: ${{ steps.apply.outputs.result }}
        run: |
          echo "### Re-score" >> "$GITHUB_STEP_SUMMARY"
          echo "- result: \`${RESULT:-n/a}\`" >> "$GITHUB_STEP_SUMMARY"
