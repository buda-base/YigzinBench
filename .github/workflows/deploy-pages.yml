name: Deploy site

# Human pushes to site/** and leaderboard/** deploy through the push trigger.
# Bot commits (publish, re-score, delete) start this workflow through
# apply-and-push.sh (`workflow_dispatch`), because pushes made with
# GITHUB_TOKEN start no workflow.
on:
  push:
    branches: [main]
    paths: ["site/**", "leaderboard/**", ".github/workflows/deploy-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Assemble site
        run: |
          mkdir _site
          cp -r site/. _site/
          cp leaderboard/leaderboard.json _site/leaderboard.json
          printf '{"repo": "%s"}\n' "$GITHUB_REPOSITORY" > _site/config.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
