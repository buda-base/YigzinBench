name: Test

on:
  push:
    branches: [main]
    paths: ["scorer/**", "tools/**", "tests/**", ".github/workflows/test.yml"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scorer/requirements.txt
      - run: pip install -r scorer/requirements.txt
      - run: python -m unittest discover -s tests -t . -v
